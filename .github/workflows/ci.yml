name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o k8s-gpu-monitor .

      - name: Report the bundled capture
        run: |
          ./k8s-gpu-monitor --from examples/capture.json
          ./k8s-gpu-monitor --from examples/capture.json -o json > out.json
          grep -q '"gpus": 10' out.json
          grep -q '"allocated": 6' out.json
          grep -q '"unscheduled": 1' out.json
          ./k8s-gpu-monitor --from examples/capture.json -o csv > out.csv
          grep -q 'gpu-node-1,NVIDIA-A100-SXM4-40GB,4,3,1,2,false' out.csv
          ./k8s-gpu-monitor --from examples/capture.json --namespace ml-training | grep -q 'TOTAL'

      - name: Check the HTML report
        run: |
          ./k8s-gpu-monitor --from examples/capture.json -o html > report.html
          grep -q '<!DOCTYPE html>' report.html
          grep -q 'GPU allocation' report.html
          grep -q 'NVIDIA-A100-SXM4-40GB' report.html
          # The report must work offline: no scripts, no external requests.
          ! grep -q '<script' report.html
          ! grep -qE '(<link|<img|src="http)' report.html

      - name: Version
        run: ./k8s-gpu-monitor version
